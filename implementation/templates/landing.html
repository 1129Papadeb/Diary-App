<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diary App</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<style>
    @keyframes float {

        0%,
        100% {
            transform: translateY(0px);
        }

        50% {
            transform: translateY(-20px);
        }
    }

    @keyframes moveDiagonal {

        0%,
        100% {
            transform: translate(0, 0);
        }

        50% {
            transform: translate(20px, -20px);
        }
    }

    .animate-float {
        animation: float 6s ease-in-out infinite;
    }

    .animate-diagonal {
        animation: moveDiagonal 8s ease-in-out infinite;
    }
</style>


<body class="bg-gray-100 min-h-screen flex flex-col font-['Poppins']">
    <!-- Navbar -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6">
            <div class="flex justify-between items-center h-16">
                <!-- Logo -->
                <div class="flex items-center space-x-2">
                    <div class="h-8 w-8 rounded-full bg-gradient-to-r from-purple-600 to-blue-500"></div>
                    <span class="text-xl font-bold text-gray-800">
                        di<span class="text-purple-600">AI</span>ry
                    </span>
                </div>

                <!-- Desktop Menu -->
                <div class="hidden md:flex space-x-6">
                    <a href="/" class="text-gray-700 hover:text-purple-600 text-sm font-medium transition">Home</a>

                    <a href="/entries" class="text-gray-700 hover:text-purple-600 text-sm font-medium transition">View
                        Entries</a>
                </div>

                <!-- Mobile Menu Button -->
                <div class="md:hidden">
                    <button type="button"
                        class="p-2 rounded-md text-gray-700 hover:text-gray-900 hover:bg-gray-100 focus:outline-none">
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div class="md:hidden px-4 pt-2 pb-4 space-y-2">
            <a href="/" class="block text-gray-700 hover:text-purple-600 text-base font-medium">Home</a>
            <a href="/features" class="block text-gray-700 hover:text-purple-600 text-base font-medium">Features</a>
            <a href="/diary"
                class="block bg-gradient-to-r from-purple-600 to-blue-500 text-white text-base font-medium px-4 py-2 rounded-lg text-center">Write
                in Diary</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="relative flex-grow flex items-center justify-center px-4 py-10 overflow-hidden">
        <!-- Background bubbles -->
        <div
            class="absolute w-72 h-72 bg-purple-400 opacity-70 rounded-full -top-10 -left-10 blur-3xl pointer-events-none animate-float">
        </div>
        <div
            class="absolute w-80 h-80 bg-blue-400 opacity-70 rounded-full -bottom-20 -right-20 blur-3xl pointer-events-none animate-diagonal">
        </div>
        <div
            class="absolute w-40 h-40 bg-pink-400 opacity-70 rounded-full top-1/3 left-1/4 blur-2xl pointer-events-none animate-float">
        </div>

        <!-- Main content card -->
        <div class="w-full max-w-4xl bg-white rounded-2xl shadow-lg p-6 sm:p-10 animate-fade-in transition-all z-10">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-800 mb-4 text-center">Your Daily Entry</h1>
            <p class="text-base sm:text-lg text-gray-600 mb-6 text-center">Current Time: {{ current_time }}</p>

            <input type="text" id="diaryTitle" placeholder="Diary Title"
                class="w-full p-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4 text-gray-800 text-base sm:text-lg font-bold" />

            <textarea id="diaryInput" placeholder="Write your diary entry here..."
                class="w-full h-48 p-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 mb-6 text-gray-800 resize-none text-base sm:text-lg transition duration-300 ease-in-out"></textarea>

            <div class="flex justify-center">
                <button id="saveBtn"
                    class="bg-gradient-to-r from-purple-600 to-blue-500 hover:from-purple-700 hover:to-blue-600 text-white font-medium py-2 px-6 rounded-lg transition-all duration-200 transform hover:scale-105 cursor-pointer">
                    Save Entry
                </button>
            </div>

            <div id="emotionDisplay"
                class="mt-6 text-center text-xl sm:text-2xl font-bold text-gray-900 transition duration-300 ease-in-out">
            </div>
            <div id="feedbackArea"
                class="mt-4 text-center text-base sm:text-lg text-gray-700 leading-relaxed transition duration-300 ease-in-out">
            </div>
        </div>
    </main>


    <script src="../static/script.js"></script>
</body>

</html>
