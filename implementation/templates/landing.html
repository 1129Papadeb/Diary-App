<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diary App</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4">
        <h1 class="text-2xl font-bold mb-4">Diary App</h1>
        <p class="text-gray-600 mb-2">Current Time: {{ current_time }}</p>
        <textarea id="diaryInput" placeholder="Write your diary entry here..." class="w-full h-32 p-2 border rounded mb-2"></textarea>
        <button id="saveBtn" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">Save</button>
        <div id="emotionDisplay" class="mt-2 font-bold"></div>
        <div id="feedbackArea" class="mt-2"></div>
    </div>
    <script src="../static/script.js"></script>
</body>
</html>
