<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diary Entries</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4">
        <h1 class="text-2xl font-bold mb-4">Diary Entries</h1>
        <ul>
            {% for entry in diary_entries %}
                <li class="mb-2">
                    <p class="text-gray-600">Date and Time: {{ entry[0] }}</p>
                    <p class="text-gray-600">Emotion: {{ entry[1] }}</p>
                    <p class="text-gray-800">Entry: {{ entry[2] }}</p>
                </li>
            {% endfor %}
        </ul>
        <a href="/diary" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Back to Diary</a>
    </div>
</body>
</html>
